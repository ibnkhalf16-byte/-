name: Build Android and Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding
        run: |
          flutter create . --platforms=android --org com.alaa.accounts

      - name: Inject Android Auto Backup Prevention & Permissions
        run: |
          python3 -c '
          import os
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              # حقن أذونات الإنترنت
              perms = "\n    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n"
              if "android.permission.INTERNET" not in content:
                  content = content.replace("<application", perms + "    <application", 1)
              
              # حقن منع النسخ الاحتياطي الرسمي
              if "allowBackup" not in content:
                  content = content.replace("<application", "<application\n        android:allowBackup=\"false\"\n        android:fullBackupContent=\"false\"", 1)
              
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)

          # ترقية minSdkVersion
          build_gradle = "android/app/build.gradle"
          if os.path.exists(build_gradle):
              with open(build_gradle, "r", encoding="utf-8") as f:
                  bg = f.read()
              bg = bg.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              bg = bg.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              with open(build_gradle, "w", encoding="utf-8") as f:
                  f.write(bg)
          '

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AlaaAbuShady-Android-App
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Windows Scaffolding
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --org com.alaa.accounts

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Compress Windows Output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\dist\AlaaAbuShady-Windows.zip

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: AlaaAbuShady-Windows-App
          path: build/dist/AlaaAbuShady-Windows.zip
          if-no-files-found: error
