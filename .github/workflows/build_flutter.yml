name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Project
        run: |
          flutter create . --platforms=android --org com.alaa.accounts

      - name: Configure Android Permissions & MinSdk
        run: |
          python3 -c '
          import os

          # 1. إضافة أذونات الإنترنت في AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()
              perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
          """
              if "android.permission.INTERNET" not in content:
                  content = content.replace("<application", perms + "\n    <application", 1)
                  with open(manifest_path, "w", encoding="utf-8") as f:
                      f.write(content)

          # 2. ترقية minSdkVersion ليتوافق مع مكتبة الطباعة pdf و printing
          build_gradle = "android/app/build.gradle"
          if os.path.exists(build_gradle):
              with open(build_gradle, "r", encoding="utf-8") as f:
                  bg_content = f.read()
              bg_content = bg_content.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              bg_content = bg_content.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              with open(build_gradle, "w", encoding="utf-8") as f:
                  f.write(bg_content)
          '

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlaaAbuShady-Flutter-App
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
